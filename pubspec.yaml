name: trackit_mobile
description: TrackIT mobile app for students and officers — companion to the Ionic web app.
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  go_router: ^14.8.1
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  mobile_scanner: ^6.0.11
  camera: ^0.11.1
  image_picker: ^1.1.2
  geolocator: ^13.0.4
  qr_flutter: ^4.1.0
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  video_player: ^2.10.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.3
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/4244.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/4244.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tech-icons/
